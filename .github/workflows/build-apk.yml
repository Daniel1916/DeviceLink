name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Preparar projeto (extrai o zip se necessário)
        id: prep
        run: |
          if [ -f "app/build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "DeviceLink.zip" ]; then
            unzip -o DeviceLink.zip -d .
            echo "dir=DeviceLink" >> "$GITHUB_OUTPUT"
          else
            echo "Não encontrei o projeto."
            exit 1
          fi

      - name: Compilar APK de debug
        working-directory: ${{ steps.prep.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: DeviceLink-debug-apk
          path: ${{ steps.prep.outputs.dir }}/app/build/outputs/apk/debug/*.apk
